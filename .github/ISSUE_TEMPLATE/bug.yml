name: Bug Report
description: Report a defect or unintended behavior
title: "[BUG] "
labels:

* bug
  body:

* type: textarea
  id: summary
  attributes:
  label: Summary
  description: Describe the bug clearly
  placeholder: What is broken?
  validations:
  required: true

* type: textarea
  id: reproduce
  attributes:
  label: Steps to Reproduce
  placeholder: |
  1.
  2.
  3.
  validations:
  required: true

* type: textarea
  id: expected
  attributes:
  label: Expected Behavior
  placeholder: What should happen?
  validations:
  required: true

* type: textarea
  id: actual
  attributes:
  label: Actual Behavior
  placeholder: What actually happened?
  validations:
  required: true

* type: dropdown
  id: severity
  attributes:
  label: Severity
  options:
  - P0 - Critical
  - P1 - High
  - P2 - Medium
  - P3 - Low
  validations:
  required: true

* type: input
  id: environment
  attributes:
  label: Environment
  placeholder: OS, browser, runtime, etc.
