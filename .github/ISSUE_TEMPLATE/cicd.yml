name: CI/CD Improvement
description: Changes related to pipelines, deployments, automation, or infrastructure
title: "[CI/CD] "
labels:

* cicd
  body:

* type: textarea
  id: objective
  attributes:
  label: Objective
  description: What pipeline or deployment issue are we addressing?
  validations:
  required: true

* type: textarea
  id: implementation
  attributes:
  label: Proposed Changes
  description: Describe the planned workflow/pipeline modifications
  validations:
  required: true

* type: textarea
  id: impact
  attributes:
  label: Expected Impact
  description: Reliability, speed, cost, deployment quality, etc.

* type: textarea
  id: rollback
  attributes:
  label: Rollback Plan
  description: How can changes be reverted safely?
